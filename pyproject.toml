[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "walt-price-bot"
version = "1.5.3"
description = "Multi-user Telegram monitor for Walt P2P RUB prices"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "aiohttp==3.14.4",
  "aiosqlite==0.22.1",
  "cryptography>=50.0.2",
  "pydantic-settings==2.15.0",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
]

[project.scripts]
walt-price-bot = "walt_price_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that call external services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
